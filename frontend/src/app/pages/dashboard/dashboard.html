<h1>Task Dashboard</h1>

<button (click)="logout()">
  Logout
</button>

<hr>

<input
  type="text"
  placeholder="Enter task"
  [(ngModel)]="title"
/>

<button (click)="addTask()">
  Add Task
</button>

<hr>

<div *ngFor="let task of tasks">

  <p>
    {{ task.title }}
  </p>

  <button
    (click)="deleteTask(task._id)"
  >
    Delete
  </button>

  <hr>

</div>
