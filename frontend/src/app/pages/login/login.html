<h2>Login</h2>

<form (ngSubmit)="login()">

  <input
    type="email"
    placeholder="Email"
    [(ngModel)]="email"
    name="email"
  />

  <br><br>

  <input
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
    name="password"
  />

  <br><br>

  <button type="submit">
    Login
  </button>
 
  

</form>
 <br>

<button (click)="navigateToSignup()">
    Don't have an account? Signup
  </button>
